# Une seule image pour l'espace de travail npm (shared + backend + frontend).
x-app: &app
  build: { context: ., target: dev }
  volumes:
    - .:/repo
    - /repo/node_modules
    - /repo/backend/node_modules
    - /repo/frontend/node_modules

services:
  traefik:
    image: traefik:latest
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      # Une ligne par requête dans `docker compose logs traefik` (débogage front ↔ API).
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.footix.localhost`)
      - traefik.http.routers.dashboard.service=api@internal

  db:
    image: postgres:latest
    environment:
      # Identifiants de dev en clair ; la prod les lit dans .env (docker-compose.prod.yml).
      - POSTGRES_USER=footix
      - POSTGRES_PASSWORD=footix
      - POSTGRES_DB=footix
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footix -d footix"]
      interval: 2s
      timeout: 5s
      retries: 15

  mailpit:
    image: axllent/mailpit:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.mailpit.rule=Host(`mail.footix.localhost`)
      - traefik.http.services.mailpit.loadbalancer.server.port=8025

  backend:
    <<: *app
    working_dir: /repo/backend
    command: sh -c "npm run db:migrate && npm run start:dev"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      - CORS_ORIGIN=http://footix.localhost
      - DATABASE_URL=postgres://footix:footix@db:5432/footix
      - APP_URL=http://footix.localhost
      # Emails gardés par Mailpit, jamais envoyés : http://mail.footix.localhost
      - MAILPIT_URL=http://mailpit:8025
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`api.footix.localhost`)
      - traefik.http.services.backend.loadbalancer.server.port=3000

  frontend:
    <<: *app
    working_dir: /repo/frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      - NUXT_PUBLIC_API_URL=http://api.footix.localhost
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`footix.localhost`)
      - traefik.http.services.frontend.loadbalancer.server.port=3000

volumes:
  db-data:

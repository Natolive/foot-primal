# Production : image construite par la CI (.github/workflows/prod.yml), rien à construire sur le serveur.
# Variables lues dans .env (voir .env.example) ; IMAGE_TAG = commit à déployer, `latest` par défaut.
# HTTPS assuré par le reverse proxy du serveur (Caddy) vers 127.0.0.1:${PORT} ; l'API est servie par le front sous /api.
x-app: &app
  image: ghcr.io/natolive/foot-primal:${IMAGE_TAG:-latest}
  restart: unless-stopped

services:
  db:
    image: postgres:latest
    restart: unless-stopped
    environment:
      - POSTGRES_USER=primal
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=primal
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primal -d primal"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    <<: *app
    working_dir: /repo/backend
    command: sh -c "npm run db:migrate && npm run start:prod"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - CORS_ORIGIN=https://${DOMAIN:?}
      - COOKIE_SECURE=true
      - DATABASE_URL=postgres://primal:${POSTGRES_PASSWORD}@db:5432/primal

  frontend:
    <<: *app
    working_dir: /repo/frontend
    command: node .output/server/index.mjs
    depends_on: [backend]
    environment:
      - NUXT_PUBLIC_API_URL=/api
    ports:
      - "127.0.0.1:${PORT:-3001}:3000"

volumes:
  db-data:
